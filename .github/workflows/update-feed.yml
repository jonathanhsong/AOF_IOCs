name: Update threat feed

on:
  schedule:
    - cron: "23 10 * * *"   # daily, 10:23 UTC (source data updates once a day)
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: bash scripts/fetch.sh

      # Runs even if a single feed failed, so good feeds still land.
      # The job is still marked failed, which triggers GitHub's email alert.
      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add feeds changes meta
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "feed: $(date -u +%F)"
          git push
